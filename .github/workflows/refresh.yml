name: Refresh stats

on:
  schedule:
    - cron: "17 0 * * *" # daily, 07:17 Jakarta time
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build stats and cards
        env:
          # STATS_TOKEN (optional): a personal token, so private contributions
          # count the same way they do on your profile. Falls back to GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/build_stats.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cards
          git diff --cached --quiet || git commit -m "chore: refresh stats"
          git push
